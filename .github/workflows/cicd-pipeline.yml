name: Full Stack Web Application CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup_environment:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache/pip
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-

  install_dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: setup_environment
    steps:
      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./frontend

      - name: Install Backend Dependencies
        run: pip install -r requirements.txt
        working-directory: ./backend

  frontend_tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    needs: install_dependencies
    steps:
      - name: Run Frontend Unit Tests
        run: npm test
        working-directory: ./frontend

  backend_tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: install_dependencies
    steps:
      - name: Run Backend Unit Tests
        run: pytest
        working-directory: ./backend

  build_frontend:
    name: Build Frontend Application
    runs-on: ubuntu-latest
    needs: frontend_tests
    steps:
      - name: Build Frontend
        run: npm run build
        working-directory: ./frontend

      - name: Archive Frontend Build
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: ./frontend/build

  deploy_backend:
    name: Deploy Backend Application
    runs-on: ubuntu-latest
    needs: backend_tests
    steps:
      - name: Deploy Backend
        run: |
          echo "Deploying backend..."
          python backend_deploy.py
        working-directory: ./backend

  deploy_frontend:
    name: Deploy Frontend Application
    runs-on: ubuntu-latest
    needs: [build_frontend, deploy_backend]
    steps:
      - name: Download Frontend Build
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: ./frontend/build

      - name: Deploy Frontend
        run: |
          echo "Deploying frontend..."
          npm run deploy
        working-directory: ./frontend

  notify_success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [deploy_frontend, deploy_backend]
    steps:
      - name: Send Notification
        run: |
          echo "CI/CD Pipeline completed successfully!"